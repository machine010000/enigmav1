<div id="page-live-console" class="page">
    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold">Live Console</h2>
                <p class="text-gray-400 text-sm">Real-time worker events</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="ws-status" class="tag tag-red text-xs">Disconnected</span>
                <button onclick="clearConsole()" class="btn-secondary text-xs py-1 px-3">
                    <i class="fas fa-trash ml-1"></i>مسح
                </button>
                <button onclick="toggleWs()" class="btn-secondary text-xs py-1 px-3">
                    <i class="fas fa-redo ml-1"></i>إعادة الاتصال
                </button>
            </div>
        </div>

        <div class="glass-card p-6">
            <div id="event-feed" class="space-y-2" style="max-height: 600px; overflow-y: auto;">
                <div class="text-gray-500 text-sm text-center py-8" id="console-empty">
                    <i class="fas fa-wifi text-gray-600 text-3xl mb-3"></i>
                    <p>Waiting for worker events…</p>
                </div>
            </div>
        </div>
    </div>
</div>
